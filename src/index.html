<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buckshot and Crosses</title>

    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <!-- Base layer: Game Grid -->
    <div id="base-panel" class="viewport-layer base-layer">
      <div id="game-container">
        <div id="table-backdrop" aria-hidden="true"></div>
        <div id="grid">
          <div class="grid-item"></div>
          <div class="grid-item"></div>
          <div class="grid-item"></div>
          <div class="grid-item"></div>
          <div class="grid-item"></div>
          <div class="grid-item"></div>
          <div class="grid-item"></div>
          <div class="grid-item"></div>
          <div class="grid-item"></div>
        </div>
      </div>
    </div>

    <!-- Notifications layer -->
    <div class="viewport-layer notifications-layer">
      <div id="shell-container">
        <div id="shell-loader"></div>
      </div>

      <div id="health-container">
        <div id="health-bar"></div>
      </div>
    </div>

    <!-- HUD layer -->
    <div class="viewport-layer hud-layer">
      <div id="shotgun-container">
        <img src="assets/shotgun.png" alt="Shotgun" id="shotgun-image" />
        <div id="shotgun-warning">Point of no return</div>
      </div>

      <div id="inventory">
        <div id="item-slot-1" class="item-slot"></div>
        <div id="item-slot-2" class="item-slot"></div>
        <div id="item-slot-3" class="item-slot"></div>
      </div>
    </div>

    <img src="assets/crosshair.png" alt="Crosshair" id="crosshair" hidden />
    <div id="aiming-help">
      Press SPACE to pump shell<br />Press ESC to cancel aiming
    </div>

    <div id="vignette" hidden></div>

    <!-- Scripts loaded at the end of the body to avoid blocking rendering / timing issues -->
    <script src="scripts/state.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/render.js"></script>
    <script src="scripts/gameplay.js"></script>
    <script src="components/inventoryItemBase.js"></script>
    <script src="components/cigarettePack.js"></script>
    <script src="components/expiredVodka.js"></script>
    <script src="components/flashlight.js"></script>
    <script src="components/handcuffs.js"></script>
    <script src="components/strangeContraption.js"></script>
    <script src="scripts/main.js"></script>
  </body>
</html>
