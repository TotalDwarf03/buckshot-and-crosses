<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buckshot and Crosses</title>

    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <!-- Left panel: Shell container -->
    <div id="shell-container" class="side-panel">
      <div id="shell-loader"></div>
    </div>

    <!-- Center panel: Game Grid -->
    <div id="center-panel">
      <div id="game-container">
        <div id="table-backdrop" aria-hidden="true"></div>
        <div id="grid">
          <div class="grid-item" onclick="updateCell(this)"></div>
          <div class="grid-item" onclick="updateCell(this)"></div>
          <div class="grid-item" onclick="updateCell(this)"></div>
          <div class="grid-item" onclick="updateCell(this)"></div>
          <div class="grid-item" onclick="updateCell(this)"></div>
          <div class="grid-item" onclick="updateCell(this)"></div>
          <div class="grid-item" onclick="updateCell(this)"></div>
          <div class="grid-item" onclick="updateCell(this)"></div>
          <div class="grid-item" onclick="updateCell(this)"></div>
        </div>
      </div>
    </div>

    <!-- Right panel: Shotgun -->
    <div id="shotgun-container" class="side-panel">
      <div id="inventory">
        <img
          src="assets/shotgun.png"
          alt="Shotgun"
          id="shotgun-image"
          onclick="pickupShotgun()"
        />
        <div id="shotgun-warning">[Point of no return]</div>
      </div>
    </div>

    <img src="assets/crosshair.png" alt="Crosshair" id="crosshair" hidden />
    <div id="aiming-help">
      [Press SPACE to pump shell]<br />[Press ESC to cancel aiming]
    </div>

    <div id="vignette" hidden></div>

    <script src="scripts/main.js"></script>
  </body>
</html>
