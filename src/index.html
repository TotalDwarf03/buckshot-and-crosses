<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buckshot and Crosses</title>

    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- Nought and Crosses Grid -->
    <div id="grid">
        <div class="grid-item" onclick="updateCell(this)"></div>
        <div class="grid-item" onclick="updateCell(this)"></div>
        <div class="grid-item" onclick="updateCell(this)"></div>
        <div class="grid-item" onclick="updateCell(this)"></div>
        <div class="grid-item" onclick="updateCell(this)"></div>
        <div class="grid-item" onclick="updateCell(this)"></div>
        <div class="grid-item" onclick="updateCell(this)"></div>
        <div class="grid-item" onclick="updateCell(this)"></div>
        <div class="grid-item" onclick="updateCell(this)"></div>
    </div>

    <div class="status-container">
        <p id="turn-display"></p>
        <button id="reset-button" onclick="resetGame()">Reset Game</button>
    </div>

    <div id="inventory">
        <div id="shotgun-slot">
            <img src="assets/shotgun.png" alt="Shotgun" id="shotgun-image" onclick="pickupShotgun()">
        </div>

        <div class="inventory-grid">
            <div class="inventory-slot" id="inventory-slot-1"></div>
            <div class="inventory-slot" id="inventory-slot-2"></div>
            <div class="inventory-slot" id="inventory-slot-3"></div>
            <div class="inventory-slot" id="inventory-slot-4"></div>
        </div>
    </div>

    <img src="assets/crosshair.png" alt="Crosshair" id="crosshair" hidden>

    <script src="scripts/main.js"></script>
    <script>
        updateTurnDisplay();
    </script>
</body>
</html>
